name: 10Q Challenge CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Next.js and .NET Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Backend Compilation
        run: |
          echo "Verifying .NET Clean Architecture structure..."
          ls -la backend/src/

      - name: Verify SQL Scripts
        run: |
          test -f database/10QChallenge_DbSchema.sql
          test -f database/10QChallenge_SeedData.sql
          echo "Database schema and seed data validated!"
